<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | Bhanu Shree Tiles & Taps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/api.js" defer></script>
  <script src="js/catalog.js" defer></script>
</head>
<body class="app-shell">
  <nav class="navbar navbar-dark nav-frost sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="products.html">Bhanu Shree Tiles & Taps</a>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="products.html">Products</a>
        <a class="btn btn-sm btn-outline-light" href="brands.html">Brands</a>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-4 py-4">
    <div class="glass-card rounded-4 p-4 mb-4 d-flex justify-content-between align-items-end gap-3">
      <div>
        <div class="section-label">Catalog</div>
        <h1 class="h2 mb-1">Categories</h1>
        <p class="muted-text mb-0">Maintain tile and product categories used throughout the ERP.</p>
      </div>
      <div id="categoryStatus" class="muted-text">Ready</div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="glass-card rounded-4 p-4 h-100">
          <h2 class="h5 mb-3">Category Form</h2>
          <form id="categoryForm">
            <input type="hidden" name="id">
            <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
            <div class="mb-3"><label class="form-label">Slug</label><input class="form-control" name="slug"></div>
            <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4"></textarea></div>
            <div class="mb-3"><label class="form-label">Active</label><select class="form-select" name="isActive"><option value="true">Active</option><option value="false">Inactive</option></select></div>
            <div class="d-grid gap-2"><button class="btn btn-accent" type="submit">Save Category</button><button class="btn btn-outline-light" data-reset type="button">Reset</button></div>
          </form>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="glass-card rounded-4 p-4 h-100">
          <h2 class="h5 mb-3">Category List</h2>
          <div class="table-responsive">
            <table class="table table-darkish align-middle">
              <thead><tr><th>Name</th><th>Slug</th><th>Description</th><th>Status</th><th>Action</th></tr></thead>
              <tbody id="categoryTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
