<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase | Bhanu Shree Tiles & Taps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/transactions.js" defer></script>
</head>
<body class="app-shell">
  <nav class="navbar navbar-dark nav-frost sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="dashboard.html">Bhanu Shree Tiles & Taps</a>
    </div>
  </nav>
  <main class="container-fluid px-4 py-4">
    <div class="glass-card rounded-4 p-4 mb-4">
      <h1 class="h3 mb-1">Add Purchase</h1>
      <p class="muted-text mb-0">Record supplier purchases and increase inventory automatically.</p>
    </div>

    <div class="row g-4">
      <div class="col-xl-5">
        <div class="glass-card rounded-4 p-4">
          <form id="purchaseForm">
            <div class="mb-3">
              <label class="form-label">Supplier ID</label>
              <input class="form-control" name="supplier" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Payment Mode</label>
              <select class="form-select" name="paymentMode">
                <option>credit</option>
                <option>cash</option>
                <option>bank-transfer</option>
              </select>
            </div>
            <div id="purchaseItems" class="mb-3"></div>
            <button type="button" class="btn btn-outline-light mb-3" id="purchaseFormAddItem">Add Item</button>
            <div class="d-grid">
              <button class="btn btn-accent" type="submit">Save Purchase</button>
            </div>
          </form>
        </div>
      </div>
      <div class="col-xl-7">
        <div class="glass-card rounded-4 p-4 h-100">
          <h2 class="h5 mb-3">Recent Purchases</h2>
          <div class="table-responsive">
            <table class="table table-darkish align-middle">
              <thead>
                <tr><th>Invoice</th><th>Total</th><th>Date</th></tr>
              </thead>
              <tbody id="purchaseFormList"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
