<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Bhanu Shree Tiles & Taps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/api.js" defer></script>
  <script src="js/public-catalog.js" defer></script>
</head>
<body class="app-shell">
  <nav class="navbar navbar-dark nav-frost sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="index.html">Bhanu Shree Tiles & Taps</a>
      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-sm btn-outline-light" href="index.html">Home</a>
        <a class="btn btn-sm btn-outline-light" href="login.html">Admin Login</a>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-4 py-4">
    <div class="glass-card rounded-4 p-4 mb-4 d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <div class="section-label">Public Catalog</div>
        <h1 class="h2 mb-1">Products</h1>
        <p class="muted-text mb-0">Browse the current product range, finishes, and stock-ready items.</p>
      </div>
      <div id="catalogStatus" class="muted-text">Loading</div>
    </div>

    <div class="glass-card rounded-4 p-4">
      <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Product List</h2>
        <div class="d-flex gap-2 flex-wrap">
          <input id="catalogSearch" class="form-control form-control-sm" placeholder="Search products, categories, or SKUs">
          <button id="catalogSearchButton" class="btn btn-sm btn-outline-light" type="button">Search</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-darkish align-middle">
          <thead>
            <tr><th>Name</th><th>Category</th><th>Brand</th><th>Size</th><th>Color</th><th>Price</th><th>Stock</th></tr>
          </thead>
          <tbody id="catalogTable"></tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
