<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password · Bhanu Shree Tiles</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/erp.css">
</head>
<body>
  <div class="auth">
    <form class="auth-card" id="form" novalidate>
      <div class="brand"><img class="brand-mark" src="images/logo.svg" alt=""><div><b>Forgot password</b><small>We will send a reset link</small></div></div>
      <div id="msg"></div>
      <div class="field"><label for="identifier">Username, contact number or email</label><input id="identifier" autofocus></div>
      <button class="btn primary">Send reset link</button>
      <p style="text-align:center;margin:14px 0 0"><a href="login.html">Back to login</a></p>
    </form>
  </div>
  <script src="js/erp.js"></script>
  <script>
    ERP.$("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const msg = ERP.$("#msg");
      const identifier = ERP.$("#identifier").value.trim();
      if (!identifier) return;
      try {
        const r = await ERP.api("/auth/forgot-password", { method: "POST", body: { identifier } });
        msg.innerHTML = `<div class="notice ok">${ERP.esc(r.message)}</div>`;
      } catch (error) {
        msg.innerHTML = `<div class="notice">${ERP.esc(error.message)}</div>`;
      }
    });
  </script>
</body>
</html>
