<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password · Bhanu Shree Tiles</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/erp.css">
</head>
<body>
  <div class="auth">
    <p class="made-by">Designed &amp; developed by <span class="dev">Sai Karthik Reddy</span></p>
    <form class="auth-card" id="form" novalidate>
      <div class="brand"><img class="brand-mark" src="images/logo.svg" alt=""><div><b>Set a new password</b><small>8+ characters with upper, lower and a number</small></div></div>
      <div id="msg"></div>
      <div class="field"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" autofocus></div>
      <div class="field"><label for="p2">Repeat password</label><input id="p2" type="password" autocomplete="new-password"></div>
      <button class="btn primary">Update password</button>
      <p style="text-align:center;margin:14px 0 0"><a href="login.html">Back to login</a></p>
    </form>
  </div>
  <script src="js/erp.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get("token");
    const say = (text, ok) => { ERP.$("#msg").innerHTML = `<div class="notice${ok ? " ok" : ""}">${ERP.esc(text)}</div>`; };
    if (!token) say("This reset link is not valid");
    ERP.$("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const newPassword = ERP.$("#p1").value;
      if (newPassword !== ERP.$("#p2").value) return say("The passwords do not match");
      try {
        const r = await ERP.api("/auth/reset-password", { method: "POST", body: { token, newPassword } });
        say(r.message, true);
      } catch (error) {
        say(error.message);
      }
    });
  </script>
</body>
</html>
