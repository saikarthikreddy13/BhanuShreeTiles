<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Bhanu Shree Tiles</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/erp.css">
</head>
<body>
  <div class="auth">
    <a class="back" href="index.html">Back to website</a>
    <form class="auth-card" id="loginForm" novalidate>
      <div class="brand"><img class="brand-full" src="images/logo-full.svg" alt="Bhanu Shree Tiles, Kajaria Studio"></div>
      <h1>Welcome back</h1>
      <p class="lead">Log in to your account</p>
      <div id="msg"></div>
      <div class="field"><label for="identifier">Username or contact number</label><input id="identifier" autocomplete="username" autofocus></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw"><input id="password" type="password" autocomplete="current-password"><button type="button" id="togglePw">Show</button></div></div>
      <div class="split"><div class="check"><input type="checkbox" id="remember"><label for="remember">Remember me</label></div><a href="forgot-password.html">Forgot password?</a></div>
      <button class="btn primary" id="loginBtn">Log in</button>
    </form>
  </div>
  <script src="js/erp.js"></script>
  <script>
    const { api, $ } = ERP;
    const msg = $("#msg");
    const show = (text, ok) => { msg.innerHTML = `<div class="notice${ok ? " ok" : ""}">${ERP.esc(text)}</div>`; };

    $("#togglePw").addEventListener("click", (e) => {
      const input = $("#password");
      input.type = input.type === "password" ? "text" : "password";
      e.target.textContent = input.type === "password" ? "Show" : "Hide";
    });

    const goHome = (user) => {
      const next = new URLSearchParams(location.search).get("next") || "";
      const can = (m, a = "read") => user.isSuperAdmin || user.permissions?.[m]?.includes(a);
      location.href = user.mustChangePassword ? "profile.html"
        : /^[\w-]+\.html(\?[\w=&-]*)?$/.test(next) ? next
        : can("dashboard") ? "dashboard.html" : "profile.html";
    };

    api("/auth/session").then((r) => { if (r.data) goHome(r.data); }).catch((e) => show(e.message));

    $("#loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const identifier = $("#identifier").value.trim();
      const password = $("#password").value;
      if (!identifier || !password) return show("Enter your username or contact number and password");
      const button = $("#loginBtn");
      button.disabled = true;
      try {
        await api("/auth/login", { method: "POST", body: { identifier, password, remember: $("#remember").checked } });
        const { data } = await api("/auth/session");
        $(".auth-card").classList.add("leaving");
        setTimeout(() => goHome(data), 300);
      } catch (error) {
        show(error.message);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
