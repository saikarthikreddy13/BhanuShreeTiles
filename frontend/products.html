<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Bhanu Shree Tiles & Taps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/api.js" defer></script>
  <script src="js/catalog.js" defer></script>
</head>
<body class="app-shell">
  <nav class="navbar navbar-dark nav-frost sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="dashboard.html">Bhanu Shree Tiles & Taps</a>
      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-sm btn-outline-light" href="categories.html">Categories</a>
        <a class="btn btn-sm btn-outline-light" href="brands.html">Brands</a>
        <a class="btn btn-sm btn-outline-light" href="reports.html">Reports</a>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-4 py-4">
    <div class="glass-card rounded-4 p-4 mb-4 d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <div class="section-label">Catalog</div>
        <h1 class="h2 mb-1">Product management</h1>
        <p class="muted-text mb-0">Manage product masters, pricing, GST, stock, and catalogue filters.</p>
      </div>
      <div id="productStatus" class="muted-text">Ready</div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-xl-4">
        <div class="glass-card rounded-4 p-4 h-100">
          <h2 class="h5 mb-3">Product Form</h2>
          <form id="productForm">
            <input type="hidden" name="id">
            <div class="mb-3"><label class="form-label">SKU</label><input class="form-control" name="sku"></div>
            <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
            <div class="mb-3"><label class="form-label">Category</label><input class="form-control" list="categoryOptions" name="category" id="productCategory" required></div>
            <datalist id="categoryOptions"></datalist>
            <div class="mb-3"><label class="form-label">Brand</label><input class="form-control" list="brandOptions" name="brand" id="productBrand"></div>
            <datalist id="brandOptions"></datalist>
            <div class="row g-2">
              <div class="col-6 mb-3"><label class="form-label">Finish</label><input class="form-control" name="finish"></div>
              <div class="col-6 mb-3"><label class="form-label">Size</label><input class="form-control" name="size"></div>
              <div class="col-6 mb-3"><label class="form-label">Color</label><input class="form-control" name="color"></div>
              <div class="col-6 mb-3"><label class="form-label">Thickness</label><input class="form-control" name="thickness"></div>
            </div>
            <div class="row g-2">
              <div class="col-6 mb-3"><label class="form-label">Price</label><input class="form-control" type="number" min="0" step="0.01" name="price" required></div>
              <div class="col-6 mb-3"><label class="form-label">MRP</label><input class="form-control" type="number" min="0" step="0.01" name="mrp"></div>
              <div class="col-6 mb-3"><label class="form-label">GST %</label><input class="form-control" type="number" min="0" step="0.01" name="gstRate" value="18"></div>
              <div class="col-6 mb-3"><label class="form-label">Stock</label><input class="form-control" type="number" min="0" name="stock" value="0"></div>
              <div class="col-6 mb-3"><label class="form-label">Low Stock Threshold</label><input class="form-control" type="number" min="0" name="lowStockThreshold" value="10"></div>
              <div class="col-6 mb-3"><label class="form-label">Unit</label><input class="form-control" name="unit" value="box"></div>
            </div>
            <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
            <div class="mb-3"><label class="form-label">Active</label><select class="form-select" name="isActive"><option value="true">Active</option><option value="false">Inactive</option></select></div>
            <div class="d-grid gap-2"><button class="btn btn-accent" type="submit">Save Product</button><button id="productFormReset" class="btn btn-outline-light" type="button">Reset</button></div>
          </form>
        </div>
      </div>

      <div class="col-xl-8">
        <div class="glass-card rounded-4 p-4 h-100">
          <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Product List</h2>
            <div class="d-flex gap-2 flex-wrap">
              <input id="productSearch" class="form-control form-control-sm" placeholder="Search">
              <select id="productCategoryFilter" class="form-select form-select-sm"><option value="">All Categories</option></select>
              <select id="productBrandFilter" class="form-select form-select-sm"><option value="">All Brands</option></select>
              <button id="productSearchButton" class="btn btn-sm btn-outline-light" type="button">Search</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-darkish align-middle">
              <thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Brand</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
              <tbody id="productTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
