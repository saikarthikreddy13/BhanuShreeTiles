<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Bhanu Shree Tiles & Taps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/api.js" defer></script>
  <script src="js/settings.js" defer></script>
</head>
<body class="app-shell">
  <nav class="navbar navbar-dark nav-frost sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="dashboard.html">Bhanu Shree Tiles & Taps</a>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="employees.html">Employees</a>
        <a class="btn btn-sm btn-outline-light" href="reports.html">Reports</a>
      </div>
    </div>
  </nav>
  <main class="container-fluid px-4 py-4">
    <div class="glass-card rounded-4 p-4 mb-4">
      <div class="section-label">Settings</div>
      <h1 class="h2 mb-1">Company, invoice, and email configuration</h1>
      <p class="muted-text mb-0">Manage branding, GST, banking, and invoice defaults.</p>
    </div>

    <div class="row g-4">
      <div class="col-xl-4">
        <div class="glass-card rounded-4 p-4 h-100">
          <div class="section-label mb-2">Current Logo</div>
          <img id="logoPreview" src="" alt="Logo" class="img-fluid rounded-3 bg-light mb-3" style="min-height: 180px; object-fit: contain; display: none;">
          <div class="muted-text" id="logoPlaceholder">No logo uploaded yet.</div>
        </div>
      </div>
      <div class="col-xl-8">
        <div class="glass-card rounded-4 p-4">
          <h2 class="h5 mb-3">Company Settings</h2>
          <form id="settingsForm" enctype="multipart/form-data">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Company Name</label><input class="form-control" name="companyName"></div>
              <div class="col-md-6"><label class="form-label">Tagline</label><input class="form-control" name="tagline"></div>
              <div class="col-md-6"><label class="form-label">GST Number</label><input class="form-control" name="gstNumber"></div>
              <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
              <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email"></div>
              <div class="col-md-6"><label class="form-label">WhatsApp</label><input class="form-control" name="whatsappNumber"></div>
              <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="3"></textarea></div>
              <div class="col-md-6"><label class="form-label">Bank Name</label><input class="form-control" name="bankName"></div>
              <div class="col-md-6"><label class="form-label">Account Number</label><input class="form-control" name="accountNumber"></div>
              <div class="col-md-6"><label class="form-label">IFSC Code</label><input class="form-control" name="ifscCode"></div>
              <div class="col-md-6"><label class="form-label">Invoice Prefix</label><input class="form-control" name="invoicePrefix"></div>
              <div class="col-12"><label class="form-label">Invoice Footer</label><textarea class="form-control" name="invoiceFooter" rows="3"></textarea></div>
              <div class="col-md-6"><label class="form-label">Email Host</label><input class="form-control" name="emailHost"></div>
              <div class="col-md-3"><label class="form-label">Email Port</label><input class="form-control" type="number" name="emailPort" value="587"></div>
              <div class="col-md-3"><label class="form-label">Email User</label><input class="form-control" name="emailUser"></div>
              <div class="col-md-6"><label class="form-label">Email Password</label><input class="form-control" type="password" name="emailPassword"></div>
              <div class="col-md-6"><label class="form-label">Company Logo</label><input class="form-control" type="file" name="logo" accept="image/*"></div>
            </div>
            <div class="d-grid mt-4"><button class="btn btn-accent" type="submit">Save Settings</button></div>
          </form>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
