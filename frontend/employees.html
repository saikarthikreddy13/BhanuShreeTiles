<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees | Bhanu Shree Tiles & Taps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/api.js" defer></script>
  <script src="js/employees.js" defer></script>
</head>
<body class="app-shell">
  <nav class="navbar navbar-dark nav-frost sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="dashboard.html">Bhanu Shree Tiles & Taps</a>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="settings.html">Settings</a>
        <a class="btn btn-sm btn-outline-light" href="reports.html">Reports</a>
      </div>
    </div>
  </nav>
  <main class="container-fluid px-4 py-4">
    <div class="glass-card rounded-4 p-4 mb-4">
      <div class="section-label">Employees</div>
      <h1 class="h2 mb-1">Staff and operations team</h1>
      <p class="muted-text mb-0">Manage employees, roles, salaries, and contact details.</p>
    </div>

    <div class="row g-4">
      <div class="col-xl-4">
        <div class="glass-card rounded-4 p-4 h-100">
          <h2 class="h5 mb-3">Employee Form</h2>
          <form id="employeeForm">
            <input type="hidden" name="id">
            <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
            <div class="mb-3"><label class="form-label">Employee Code</label><input class="form-control" name="employeeCode" required></div>
            <div class="mb-3"><label class="form-label">Role</label><input class="form-control" name="role" required></div>
            <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
            <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email"></div>
            <div class="mb-3"><label class="form-label">Salary</label><input class="form-control" type="number" min="0" name="salary" value="0"></div>
            <div class="mb-3"><label class="form-label">Status</label><select class="form-select" name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
            <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3"></textarea></div>
            <div class="d-grid gap-2"><button class="btn btn-accent" type="submit">Save Employee</button><button class="btn btn-outline-light" type="button" id="employeeReset">Reset</button></div>
          </form>
        </div>
      </div>
      <div class="col-xl-8">
        <div class="glass-card rounded-4 p-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Employee List</h2>
            <span id="employeeStatus" class="muted-text">Ready</span>
          </div>
          <div class="table-responsive">
            <table class="table table-darkish align-middle">
              <thead><tr><th>Code</th><th>Name</th><th>Role</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead>
              <tbody id="employeeTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
